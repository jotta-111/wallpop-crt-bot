name: Vigilar Wallapop

on:
  schedule:
    # Cada 10 minutos. El mínimo que permite GitHub es 5 ('*/5 * * * *').
    - cron: '*/10 * * * *'
  # Permite lanzarlo a mano desde la pestaña Actions con un botón.
  workflow_dispatch:

# Necesario para que el bot pueda guardar la lista de anuncios ya vistos.
permissions:
  contents: write

jobs:
  vigilar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install requests

      - name: Ejecutar el bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py

      - name: Guardar los anuncios ya vistos
        run: |
          git config user.name "wallapop-bot"
          git config user.email "bot@users.noreply.github.com"
          git add wallapop_vistos.json
          git diff --staged --quiet || git commit -m "Actualizar anuncios vistos"
          git push
